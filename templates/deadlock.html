{% extends "base.html" %}
{% block title %}Deadlock Management{% endblock %}
{% block content %}
<h1>Deadlock Management</h1>
<div class="panel">
    <label>Mode
        <select id="mode">
            <option value="banker">Banker's Algorithm (safety check)</option>
            <option value="detection">Deadlock Detection</option>
        </select>
    </label>
    <div class="row top">
        <label class="grow">Allocation matrix (one process per line)<textarea id="alloc" rows="6"></textarea></label>
        <label class="grow"><span id="m2label">Maximum matrix</span><textarea id="m2" rows="6"></textarea></label>
    </div>
    <label class="block">Available resources<input id="avail"></label>
    <div id="reqBox" class="row">
        <label>Optional request — process index <input type="number" id="reqPid" value="1" min="0" style="width:70px"></label>
        <label>Request vector <input id="reqVec" placeholder="e.g. 1 0 2"></label>
    </div>
    <button id="run" class="btn">Analyse</button>
</div>
<div id="error" class="error" hidden></div>
<div id="output" hidden><div class="panel" id="out"></div></div>
{% endblock %}
{% block scripts %}
<script>
const EX = {
  banker: {a: '0 1 0\n2 0 0\n3 0 2\n2 1 1\n0 0 2', m: '7 5 3\n3 2 2\n9 0 2\n2 2 2\n4 3 3', v: '3 3 2', label: 'Maximum matrix'},
  detection: {a: '0 1 0\n2 0 0\n3 0 3\n2 1 1\n0 0 2', m: '0 0 0\n2 0 2\n0 0 0\n1 0 0\n0 0 2', v: '0 0 0', label: 'Request matrix'}
};
const mode = document.getElementById('mode');
function load() {
    const e = EX[mode.value];
    alloc.value = e.a; m2.value = e.m; avail.value = e.v;
    document.getElementById('m2label').textContent = e.label;
    document.getElementById('reqBox').hidden = mode.value !== 'banker';
}
mode.onchange = load; load();
const matrix = t => t.trim().split('\n').filter(l => l.trim()).map(parseNums);

document.getElementById('run').onclick = async () => {
    const err = document.getElementById('error'); err.hidden = true;
    try {
        const payload = {mode: mode.value, allocation: matrix(alloc.value), matrix2: matrix(m2.value),
            available: parseNums(avail.value)};
        if (mode.value === 'banker' && reqVec.value.trim()) {
            payload.request = parseNums(reqVec.value); payload.request_pid = reqPid.value;
        }
        render(await postJSON('/api/deadlock', payload), payload);
    } catch (e) { showError(err, e.message); document.getElementById('output').hidden = true; }
};

function render(d, p) {
    document.getElementById('output').hidden = false;
    const r = d.result; let h = '';
    if (d.mode === 'banker') {
        h += `<h2>Need = Maximum − Allocation</h2>` + table(['Process', 'Allocation', 'Maximum', 'Need'],
            p.allocation.map((row, i) => ['P' + i, row.join(' '), p.matrix2[i].join(' '), r.need[i].join(' ')]));
        h += `<div class="verdict ${r.safe ? 'ok' : 'bad'}">${r.safe ? 'SAFE STATE' : 'UNSAFE STATE'}</div>`;
        if (r.safe) h += `<p><b>Safe sequence:</b> ${r.sequence.join(' → ')}</p>`;
        else h += `<p>Processes that cannot finish: ${r.unfinished.join(', ')}</p>`;
        h += '<h2>Steps</h2>' + table(['Process', 'Need', 'Work before', 'Work after'],
            r.steps.map(s => [s.process, s.need.join(' '), s.work_before.join(' '), s.work_after.join(' ')]));
        if (d.request) h += `<div class="verdict ${d.request.granted ? 'ok' : 'bad'}">Request: ${d.request.granted ? 'GRANTED' : 'DENIED'}</div><p>${esc(d.request.reason)}` +
            (d.request.sequence ? ` Safe sequence: ${d.request.sequence.join(' → ')}` : '') + '</p>';
    } else {
        h += `<div class="verdict ${r.deadlock ? 'bad' : 'ok'}">${r.deadlock ? 'DEADLOCK DETECTED' : 'NO DEADLOCK'}</div>`;
        h += r.deadlock ? `<p>Deadlocked processes: <b>${r.deadlocked.join(', ')}</b></p>`
                        : `<p>Completion order: ${r.order.join(' → ') || '(all processes hold nothing)'}</p>`;
    }
    document.getElementById('out').innerHTML = h;
}
</script>
{% endblock %}
